<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Firebase</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.15);
        }
        .btn-whatsapp {
            background-color: #25d366;
            border-color: #25d366;
        }
        .btn-whatsapp:hover {
            background-color: #20b858;
            border-color: #20b858;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(37, 211, 102, 0.25);
            border-color: #25d366;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">🔑 Recuperar Senha</h2>
                            <p class="text-muted">Enviaremos um link para seu e-mail</p>
                        </div>
                        
                        <div id="bloco-passo-1">
                            <div class="mb-3">
                                <label for="input-email" class="form-label fw-medium">Seu E-mail Cadastrado</label>
                                <input 
                                    type="email" 
                                    id="input-email" 
                                    class="form-control form-control-lg"
                                    placeholder="seuemail@exemplo.com"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                            <button id="btn-enviar" onclick="enviarLinkRecuperacao()" 
                                class="btn btn-whatsapp btn-lg w-100 text-white">
                                Enviar Link de Recuperação
                            </button>
                        </div>
                        
                        <div id="bloco-passo-2" class="d-none">
                            <div class="text-center mb-4">
                                <h5>✅ Verifique sua caixa de entrada</h5>
                                <p class="text-muted">Enviamos o link de redefinição.</p>
                            </div>
                            <button onclick="voltarParaPasso1()" 
                                class="btn btn-outline-secondary w-100 mb-2">
                                Reenviar / Alterar E-mail
                            </button>
                            <a href="login.html" class="btn btn-primary w-100">Voltar ao Login</a>
                        </div>
                        
                        <div id="area-mensagem" class="mt-4 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

    <script>
        // ==================================================
        // 🔴 VERIFIQUE E PREENCHA ABAIXO SEUS DADOS
        // ==================================================
        const firebaseConfig = {
            apiKey: "COPIE_SUA_API_KEY_AQUI",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto-nome",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "NUMERO_DO_SENDER",
            appId: "1:NUMERO:WEB:CODIGO"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        function exibirMensagem(texto, tipo = "info") {
            const caixa = document.getElementById("area-mensagem");
            caixa.innerHTML = `<div class="alert alert-${tipo} mb-0">${texto}</div>`;
        }

        function limparMensagem() {
            document.getElementById("area-mensagem").innerHTML = "";
        }

        function estadoBotao(idBotao, carregando) {
            const btn = document.getElementById(idBotao);
            if (carregando) {
                btn.disabled = true;
                btn.dataset.textoOriginal = btn.innerHTML;
                btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Aguarde...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.textoOriginal;
            }
        }

        async function enviarLinkRecuperacao() {
            const email = document.getElementById("input-email").value.trim();
            
            if (!email) {
                exibirMensagem("⚠️ Digite seu e-mail!", "warning");
                return;
            }
            if (!email.includes("@") || !email.includes(".")) {
                exibirMensagem("⚠️ Digite um e-mail válido (ex: nome@dominio.com)!", "warning");
                return;
            }
            
            limparMensagem();
            estadoBotao("btn-enviar", true);

            try {
                console.log("Tentando enviar para:", email);
                await auth.sendPasswordResetEmail(email);
                
                exibirMensagem("✅ Link enviado com sucesso! Verifique sua caixa de entrada (e spam).", "success");
                setTimeout(() => {
                    document.getElementById("bloco-passo-1").classList.add("d-none");
                    document.getElementById("bloco-passo-2").classList.remove("d-none");
                }, 1500);

            } catch (erro) {
                console.error("=== CÓDIGO DO ERRO ===", erro.code);
                console.error("=== DETALHES ===", erro);
                
                let mensagem = "Erro desconhecido. Tente novamente mais tarde.";
                
                // Tratamento detalhado dos erros
                switch (erro.code) {
                    case "auth/user-not-found":
                        mensagem = `❌ Nenhum usuário cadastrado com: <strong>${email}</strong><br>Verifique se digitou corretamente.`;
                        break;
                    case "auth/invalid-email":
                        mensagem = "❌ Formato de e-mail inválido. Verifique e tente novamente.";
                        break;
                    case "auth/missing-android-pkg-name":
                    case "auth/missing-continue-uri":
                        mensagem = "❌ Configuração incompleta no Firebase. Verifique os domínios autorizados.";
                        break;
                    case "auth/operation-not-allowed":
                        mensagem = "❌ Provedor E-mail/Senha não está ativado no Firebase Console.<br>Ative em: Autenticação → Métodos de login.";
                        break;
                    case "auth/too-many-requests":
                        mensagem = "⚠️ Muitas tentativas consecutivas. Aguarde alguns minutos e tente novamente.";
                        break;
                    case "auth/unauthorized-domain":
                        mensagem = "❌ Domínio não autorizado!<br>Adicione seu domínio em: Firebase → Autenticação → Configurações → Domínios autorizados.";
                        break;
                    default:
                        mensagem = `❌ Erro: ${erro.code}<br>Verifique o console do navegador (F12) para detalhes.`;
                }
                
                exibirMensagem(mensagem, "danger");
            }

            estadoBotao("btn-enviar", false);
        }

        function voltarParaPasso1() {
            limparMensagem();
            document.getElementById("bloco-passo-2").classList.add("d-none");
            document.getElementById("bloco-passo-1").classList.remove("d-none");
            document.getElementById("input-email").value = "";
            document.getElementById("input-email").focus();
        }
    </script>
</body>
</html>
